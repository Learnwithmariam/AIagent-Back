# G.K. BTU Students — API Worker
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "aiagent-back"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# All data + live proctoring sockets live in one SQLite-backed Durable Object
[[durable_objects.bindings]]
name = "HUB"
class_name = "CourseHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CourseHub"]

# Daily digest: 04:00 UTC = 08:00 in Tbilisi (UTC+4, no daylight saving)
[triggers]
crons = ["0 4 * * *"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
# Comma-separated frontend origins allowed by CORS. Replace <subdomain> with your account's
# workers.dev subdomain (shown by `wrangler deploy` in the frontend repo), or use a custom domain.
FRONTEND_URL = "https://aiagent-front.giorgi-khatiashvili-9e4.workers.dev"
PUBLIC_APP_URL = "https://aiagent-front.giorgi-khatiashvili-9e4.workers.dev"
JWT_EXPIRES_IN = "12h"
ADMIN_EMAIL = "giorgi.khatiashvili@btu.edu.ge"
ADMIN_NAME = "Prof. Giorgi Khatiashvili"
# AI is used only for the student chat and for writing digest summaries. Grading is 100% manual.
# Models are chosen automatically: the server reads OpenRouter's live catalogue, keeps only
# zero-price models and falls through them on any error. Students never pick a model.
# Optional: free model ids to try first (ids that aren't currently free are ignored).
OPENROUTER_MODELS = ""
# Free public RSS/Atom feeds for the daily digest (comma-separated). Empty = built-in list
# (TechCrunch Startups, Crunchbase News, Sifted, EU-Startups, VentureBeat).
DIGEST_FEEDS = ""
# Resend is used ONLY for account emails (welcome + temporary password, password reset).
# The daily digest is in-app only and never emailed. The sender domain must be verified in Resend;
# until then Resend only delivers to your own Resend account address from onboarding@resend.dev.
MAIL_FROM = "G.K. BTU Students <onboarding@resend.dev>"
DIGEST_ENABLED = "true"
DIGEST_TIMEZONE = "Asia/Tbilisi"
EXAM_MAX_PAUSES = "3"
EXAM_SUBMIT_GRACE_SECONDS = "60"

# Secrets — set once with `npx wrangler secret put <NAME>` (never commit them):
#   JWT_SECRET          long random string
#   ADMIN_PASSWORD      lecturer's first password (used only when no admin exists yet)
#   OPENROUTER_API_KEY  https://openrouter.ai/keys
#   RESEND_API_KEY      https://resend.com/api-keys (account emails only; without it the temporary
#                       password is shown once to the lecturer instead)

# Local development (`npm run dev`) reads overrides and secrets from .dev.vars
